name: Bug report
description: Report a problem with xboard/php
title: '[bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include SDK version, PHP version, and minimal reproduction if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Security
      options:
        - label: I have not included API keys or private tokens in this report
          required: true
